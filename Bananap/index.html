        function setupAudio() {
            // Setup global effects
            masterFilter = new Tone.Filter({ type: "lowpass", frequency: 20000 }).toDestination();
            masterReverb = new Tone.Reverb({ decay: 2.0, preDelay: 0.01 }).connect(masterFilter);

            // Generate Reverb IR
            masterReverb.generate();

            tiroSound = new Tone.Player("media/tiro.mp3").toDestination();
            palmSound = new Tone.Player("media/palmeres.mp3").toDestination();
            clapSound = new Tone.Player("media/clap.mp3").toDestination();

            backgroundMusic = new Tone.Player({
                url: "media/musica.mp3",
                loop: true,
                volume: -10,
                onload: () => {
                    backgroundMusicReady = true;
                    syncBackgroundMusic();
                }
            }).toDestination();

            // Setup 4 distinct sounds for the 4 buttons routing to Reverb
            // Sound 0: Deep Kick
            sound0 = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, envelope: { attack: 0.001, decay: 0.25, sustain: 0, release: 0.1 } }).connect(masterReverb);
            // Sound 1: Snare/Hat
            sound1 = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.12, sustain: 0, release: 0.05 } }).connect(masterReverb);
            // Sound 2: Pluck
            sound2 = new Tone.PluckSynth({ attackNoise: 2, dampening: 3500, resonance: 0.95 }).connect(masterReverb);
            // Sound 3: FM Bell
            sound3 = new Tone.FMSynth({ harmonicity: 3, modulationIndex: 8, envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 }, modulation: { type: 'square' } }).connect(masterReverb);
        }

        // --- SERIAL CONNECTION ---
        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 }); // Canviat a 115200

                if (!toneStarted) {
                    await Tone.start();
                    setupAudio();
                    toneStarted = true;
                }

                startScreen.style.display = 'none';
                if (footer) footer.classList.add('footer--hidden');
                experienciaIniciada = true;
                gameState = "INTRO_PLANTS";
                statusText.innerText = "Arduino Connected";
                loop();

                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                readLoop();
            } catch (err) {
                console.error("Connection error:", err);
                alert("Error: " + err.message);
            }
        }

        connectBtn.addEventListener('click', connectSerial);

        async function readLoop() {
            while (true) {
                const { value, done } = await reader.read();
                if (done) {
                    reader.releaseLock();
                    break;
                }
                if (value) {
                    // Depuració: Mostrar immediatament si arriba ALGUN tipus de dada
                    if (!statusText.innerText.startsWith("Rebent:")) {
                        statusText.innerText = "Dades crues rebent-se... (esperant salt de línia)";
                    }

                    inputBuffer += value;
                    let lines = inputBuffer.split('\n');
                    // Process all complete lines
                    for (let i = 0; i < lines.length - 1; i++) {
                        processArduinoData(lines[i].trim());
                    }
                    // Keep incomplete part in buffer
                    inputBuffer = lines[lines.length - 1];
                }
            }
        }

        function processArduinoData(line) {
            if (!line) return;

            // Per depurar: mostrar la línia rebuda al panell i a la consola
            statusText.innerText = "Rebent: " + line;

            try {
                // L'Arduino està enviant un objecte JSON com: {"f":[0,0,0,0,0],"b":[0,0,1,0]}
                const data = JSON.parse(line);

                if (data.f && data.f.length >= 5) {
                    for (let i = 0; i < 5; i++) {
                        faders[i] = parseInt(data.f[i]);
                    }
                }

                if (data.b && data.b.length >= 4) {
                    for (let i = 0; i < 4; i++) {
                        let currentBtn = parseInt(data.b[i]);
                        if (currentBtn === 1 && prevButtons[i] === 0) {
                            if (gameState === "MINIGAME_CATCH" && i === 0 && clapSound) {
                                clapSound.start();
                            }
                            dispararEfecte(i);
                        }
                        prevButtons[i] = currentBtn;
                        buttons[i] = currentBtn;
                    }
                }
            } catch (e) {
                // Si la línia no és JSON vàlid (per exemple si es talla a mig enviar), l'ignorem
                // console.log("Format no vàlid:", line);
            }
        }

        function createPanelShell({ left, top, width, height, className = '' }) {
            const panel = document.createElement('section');
            panel.className = `banana-panel${className ? ` ${className}` : ''}`;
            panel.style.left = `${left}px`;
            panel.style.top = `${top}px`;
            panel.style.width = `${width}px`;
            panel.style.height = `${height}px`;

            const content = document.createElement('div');
            content.className = 'banana-panel__content';
            panel.appendChild(content);

            return { panel, content };
        }

        function appendStackPanel(panels, config) {
            const { panel, content } = createPanelShell(config);

            const title = document.createElement('p');
            title.className = 'banana-panel__title';
            title.textContent = config.title;
            content.appendChild(title);

            if (config.divider) {
                const divider = document.createElement('div');
                divider.className = 'banana-panel__divider';
                content.appendChild(divider);
            }

            if (config.secondary) {
                const secondary = document.createElement('p');
                secondary.className = 'banana-panel__secondary';
                secondary.textContent = config.secondary;
                content.appendChild(secondary);
            }

            if (config.body) {
                const body = document.createElement('p');
                body.className = 'banana-panel__body';
                body.textContent = config.body;
                content.appendChild(body);
            }

            panels.push(panel);
        }

        function appendCompactPanel(panels, config) {

        function loadCatchScoreboard() {
            try {
                const raw = localStorage.getItem(catchScoreboardStorageKey);
                const parsed = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(parsed)) {
                    return [];
                }
                return parsed
                    .filter((entry) => entry && typeof entry === 'object')
                    .map((entry) => ({
                        name: String(entry.name || 'ANON').slice(0, 18),
                        score: Number(entry.score) || 0,
                        time: Number(entry.time) || Date.now()
                    }))
                    .sort((a, b) => b.score - a.score || b.time - a.time)
                    .slice(0, 10);
            } catch (error) {
                return [];
            }
        }

        function saveCatchScoreboard(entries) {
            try {
                localStorage.setItem(catchScoreboardStorageKey, JSON.stringify(entries));
            } catch (error) {
                console.error('No s\'ha pogut desar la scoreboard:', error);
            }
        }

        function addCatchScoreEntry(name, score) {
            const safeName = (name || 'ANON').trim().slice(0, 18) || 'ANON';
            catchScoreboard = loadCatchScoreboard();
            catchScoreboard.push({
                name: safeName,
                score: Number(score) || 0,
                time: Date.now()
            });
            catchScoreboard = catchScoreboard
                .sort((a, b) => b.score - a.score || b.time - a.time)
                .slice(0, 10);
            saveCatchScoreboard(catchScoreboard);
        }

        function startMinigameFromHub(minigameId) {
            minigameHubMode = true;

            if (minigameId === 1) {
                gameState = 'MINIGAME_PLANTS';
                startTimePlants = 0;
                plantsWinReady = false;
            } else if (minigameId === 2) {
                gameState = 'MINIGAME_PALMTREES';
                palmHits = [0, 0, 0, 0];
                palmDropped = [false, false, false, false];
                palmDisabled = [false, false, false, false];
                palmShaking = [false, false, false, false];
                palmShakeTimer = [0, 0, 0, 0];
                palmFallingBananas = [];
                palmBananasCollected = 0;
                palmWinTime = 0;
            } else if (minigameId === 3) {
                gameState = 'MINIGAME_CATCH';
                endlessModeActive = true; // Enable endless mode when selected from hub
                catchScore = 0;
                catchLives = 3;
                fallingBananas = [];
                startTimeCatch = 0;
                lastBananaSpawn = 0;
                catchTotalSpawned = 0;
            } else if (minigameId === 4) {
                gameState = 'MINIGAME_PEELING';
                peeledBananas = 0;
                peelPhase = 0;
                currentSequenceIndex = 0;
                startTime = 0;
                endTime = 0;
            } else if (minigameId === 5) {
                gameState = 'MINIGAME_SEQUENCE';
                mg5ActiveButton = 0;
                mg5AnimationPlaying = false;
                mg5CurrentAnimFrame = 0;
                mg5ShotFired = false;
            }
        }

                let expIdx2 = floor((millis() / 800) % explanationSprites2.length);
                if (explanationSprites2[expIdx2]) {
                    imageMode(CENTER);
                    image(explanationSprites2[expIdx2], width - 200, height / 2 - 50, explanationSprites2[expIdx2].width * 0.1, explanationSprites2[expIdx2].height * 0.1);
                }
                textAlign(CENTER, CENTER);
                textSize(48);
                textStyle(BOLD);
                fill('rgba(120, 63, 4, 1)');

                text("Minijoc 2: Recol·lecció de Plàtans", width / 2, height / 2 - 50);
                textSize(32);
                text("Colpeja les 4 palmeres prement els Botons 1, 2, 3 i 4\n(5 cops cadascun)", width / 2, height / 2 + 50);
                textSize(24);
                text("Prem el Botó 4 per començar", width / 2, height / 2 + 150);

            } else if (gameState === "INTRO_CATCH") {
                background('#FFDF99');
                let expIdx3 = floor((millis() / 800) % explanationSprites3.length);
                if (explanationSprites3[expIdx3]) {
                    imageMode(CENTER);
                    image(explanationSprites3[expIdx3], width - 200, height / 2 - 50, explanationSprites3[expIdx3].width * 0.1, explanationSprites3[expIdx3].height * 0.1);
                }
                textAlign(CENTER, CENTER);
                textSize(48);
                textStyle(BOLD);
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                text("Minijoc 3: Atrapa Plàtans", width / 2, height / 2 - 50);
                textSize(32);
                text("Mou la mà amb el Fader 1 i tanca-la\namb el Botó 1 per atrapar-los!", width / 2, height / 2 + 50);
                textSize(24);
                text("Prem el Botó 4 per començar", width / 2, height / 2 + 150);

            } else if (gameState === "INTRO_PEELING") {
                background('#FFDF99');
                let expIdx = floor((millis() / 400) % 6);
                if (explanationSprites[expIdx]) {
                    imageMode(CENTER);
                    image(explanationSprites[expIdx], width - 200, height / 2 - 50, explanationSprites[expIdx].width * 0.1, explanationSprites[expIdx].height * 0.1);
                }
                textAlign(CENTER, CENTER);
                textSize(48);
                textStyle(BOLD);
                fill('rgba(120, 63, 4, 1)');

                textSize(24);

            } else if (gameState === "INTRO_SEQUENCE") {
                background('#FFDF99');
                let expIdx5 = floor((millis() / 400) % explanationSprites5.length);
                if (explanationSprites5[expIdx5]) {
                    imageMode(CENTER);
                    image(explanationSprites5[expIdx5], width - 200, height / 2 - 50, explanationSprites5[expIdx5].width * 0.1, explanationSprites5[expIdx5].height * 0.1);
                }
                textAlign(CENTER, CENTER);
                textSize(48);
                textStyle(BOLD);
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                text("Minijoc 5: Seqüència Final", width / 2, height / 2 - 50);
                textSize(32);
                text("Activa els botons un per un (1 -> 2 -> 3 -> 4)\nper veure l'animació", width / 2, height / 2 + 50);
                textSize(24);
                text("Prem el Botó 4 per començar", width / 2, height / 2 + 150);

                // ============================
                // MINIGAME 1: PLANTS
                // ============================
            } else if (gameState === "MINIGAME_PLANTS") {
                if (startTimePlants === 0) startTimePlants = millis();

                let timeElapsed = millis() - startTimePlants;
                let timeLeft = max(0, maxTimePlants - timeElapsed);

                if (timeLeft === 0) {
                    gameState = "LOSE_SCREEN_PLANTS";
                }

                imageMode(CENTER);
                if (imgMono) {
                            endlessModeActive = false; // Ensure endless mode is disabled when starting the minigame
                    image(imgMono, width / 2, height / 2, imgMono.width * 0.15, imgMono.height * 0.15);
                }

                for (let i = 0; i < 4; i++) {
                    let angle = map(faders[i + 1], 0, 1023, PI, PI + HALF_PI);
                    if (i === 0 || i === 2) {
                        angle += PI; // Rota 180 graus les dues plantes de l'esquerra
                    }
                    let px = width * plantPositions[i].x;
                    let py = height * plantPositions[i].y;
                    push();
                    translate(px, py);
                    rotate(angle);
                    imageMode(CORNER);
                    if (imgPlants[i]) {
                        image(imgPlants[i], 0, 0, imgPlants[i].width * 0.2, imgPlants[i].height * 0.2);
                    }
                    pop();
                }

                let threshold = 1023 * 0.9;
                plantsWinReady = (faders[1] > threshold && faders[2] > threshold && faders[3] > threshold && faders[4] > threshold);

                // Countdown sprite at bottom center
                let countdownStage = floor(timeElapsed / 2000);
                if (countdownStage > 5) countdownStage = 5;
                let countdownFrame = floor((millis() / 300) % 2);
                let cdSprite = countdownSprites[countdownStage][countdownFrame];
                if (cdSprite) {
                    imageMode(CENTER);
                    image(cdSprite, width / 2, height - 80, cdSprite.width * 0.25, cdSprite.height * 0.25);
                }

                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, TOP);
                textSize(28);
                textStyle(BOLD);
                text("Mou els faders per descobrir el mono!", width / 2, 30);

                if (plantsWinReady) {
                    textAlign(CENTER, TOP);
                    textSize(24);
                    textStyle(BOLD);
                    text("Prem el Botó 1 per continuar!", width / 2, 70);
                }

            } else if (gameState === "LOSE_SCREEN_PLANTS") {
                // Explosion animation at bottom
                let expFrame = floor((millis() / 200) % 4);
                if (expSprites[expFrame]) {
                    imageMode(CENTER);
                    image(expSprites[expFrame], width / 2, height - 80, expSprites[expFrame].width * 0.25, expSprites[expFrame].height * 0.25);
                }

                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(48);
                textStyle(BOLD);
                text("TEMPS ESGOTAT!", width / 2, height / 2 - 50);
                textSize(24);
                textStyle(BOLD);
                text("Prem el Botó 4 per tornar a intentar-ho", width / 2, height / 2 + 50);

            } else if (gameState === "WIN_SCREEN_PLANTS") {
                imageMode(CENTER);
                if (imgMono) {
                    image(imgMono, width / 2, height / 2, imgMono.width * 0.15, imgMono.height * 0.15);
                }
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(48);
                textStyle(BOLD);
                text("MONO DESCOBERT!", width / 2, height / 2 - 50);
                textSize(24);
                textStyle(BOLD);
                text("Prem el Botó 4 per al següent minijoc", width / 2, height / 2 + 50);

                // ============================
                // MINIGAME 3: CATCH
                // ============================
            } else if (gameState === "MINIGAME_CATCH") {
                background('#FFDF99');

                // Initialize timer on first frame
                if (startTimeCatch === 0) {
                    startTimeCatch = millis();
                }

                // Endless mode: no time limit, continuous spawning
                if (endlessModeActive) {
                    // No restart condition
                } else {
                    // Normal mode: Check if 15 seconds have passed and restart
                    if (millis() - startTimeCatch > 15000) {
                        gameState = "MINIGAME_CATCH";
                        catchScore = 0;
                        catchLives = 3;
                        fallingBananas = [];
                        startTimeCatch = 0;
                        lastBananaSpawn = 0;
                        catchTotalSpawned = 0;
                    }
                }

                // Calculate difficulty multiplier for endless mode
                let timePassed = millis() - startTimeCatch;
                let difficultyMultiplier = 1 + (timePassed / 20000); // Difficulty increases every 20 seconds

                // Spawn bananas
                let maxBananas = endlessModeActive ? 999 : 4; // Unlimited in endless mode
                let spawnIntervalAdj = endlessModeActive ? bananaSpawnInterval / difficultyMultiplier : bananaSpawnInterval;
                
                if (catchTotalSpawned < maxBananas && millis() - lastBananaSpawn > spawnIntervalAdj) {
                    let speedAdj = endlessModeActive ? random(2 * difficultyMultiplier, 5 * difficultyMultiplier) : random(2, 5);
                    fallingBananas.push({
                        x: random(100, width - 100),
                        y: -50,
                        speed: speedAdj,
                        rotFrame: floor(random(4))
                    });
                    lastBananaSpawn = millis();
                    catchTotalSpawned++;
                }

                // Hand position from fader 1
                let handX = map(faders[0], 0, 1023, 50, width - 50);
                let handY = height - 100;
                let handIdx = buttons[0] === 1 ? 1 : 0; // 1.2 tancat si Botó 1 premut
                let handW = handSprites[handIdx].width * 0.1;
                let handH = handSprites[handIdx].height * 0.1;

                // Update and draw falling bananas
                let bananasToRemove = [];
                let catchThisFrame = 0;

                for (let i = 0; i < fallingBananas.length; i++) {
                    let b = fallingBananas[i];
                    b.y += b.speed;
                    b.rotFrame = floor((millis() / 150) % 4);

                    let bW = bananaRotSprites[0].width * 0.1;
                    let bH = bananaRotSprites[0].height * 0.1;

                    let shouldRemove = false;

                    // Check collision with hands (only if closed)
                    if (buttons[0] === 1 && !shouldRemove) {
                        let dx = abs(b.x - handX);
                        let dy = abs(b.y - handY);
                        if (dx < (handW * 0.5 + bW) / 2 && dy < (handH * 0.5 + bH) / 2) {
                            catchScore++;
                            catchThisFrame++;
                            shouldRemove = true;
                        }
                    }

                    // Banana fell off screen
                    if (b.y > height + 50 && !shouldRemove) {
                        catchLives--;
                        sound0.triggerAttackRelease('C1', '8n');
                        shouldRemove = true;
                    }

                    if (shouldRemove) {
                        bananasToRemove.push(i);
                    } else {
                        // Draw banana
                        imageMode(CENTER);
                        image(bananaRotSprites[b.rotFrame], b.x, b.y, bW, bH);
                    }
                }

                // Play sound only once for caught bananas
                if (catchThisFrame > 0) {
                    sound3.triggerAttackRelease('A5', '16n');
                }

                // Remove bananas in reverse order to maintain correct indices
                for (let i = bananasToRemove.length - 1; i >= 0; i--) {
                    fallingBananas.splice(bananasToRemove[i], 1);
                }

                // Draw hands
                imageMode(CENTER);
                image(handSprites[handIdx], handX, handY, handW, handH);

                // Check win/lose
                if (!endlessModeActive && catchScore >= catchTargetScore) {
                    gameState = "WIN_SCREEN_CATCH";
                } else if (catchLives <= 0) {
                    gameState = "LOSE_SCREEN_CATCH";
                }

                // Draw score/counter
                if (endlessModeActive) {
                    // Endless mode: show score as text
                    fill('rgba(120, 63, 4, 1)');
                    noStroke();
                    textAlign(CENTER, TOP);
                    textSize(48);
                    textStyle(BOLD);
                    text(catchScore, width / 2, 120);
                } else {
                    // Normal mode: show counter animation
                    let counterIdx = min(catchScore, 4);
                    let counterFrames = counterSpritesCatch[counterIdx];
                    if (counterFrames && counterFrames.length > 0) {
                        let counterFrame = floor((millis() / 300) % counterFrames.length);
                        let sprite = counterFrames[counterFrame];
                        if (sprite) {
                            imageMode(CENTER);
                            let w = sprite.width * 0.08;
                            let h = sprite.height * 0.08;
                            image(sprite, width / 2, 140, w, h);
                        }
                    }
                }

                // Draw lives
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(RIGHT, TOP);
                textSize(28);
                textStyle(BOLD);
                text("Vides: " + catchLives, width - 30, 30);

                // Draw difficulty multiplier in endless mode
                if (endlessModeActive) {
                    textAlign(LEFT, TOP);
                    textSize(24);
                    text("Dificultat: " + difficultyMultiplier.toFixed(2) + "x", 30, 30);
                }

            } else if (gameState === "WIN_SCREEN_CATCH") {
                background('#FFDF99');
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(48);
                textStyle(BOLD);
                text("PLÀTANS ATRAPATS!", width / 2, height / 2 - 50);
                textSize(24);
                textStyle(BOLD)
                text("Prem el Botó 4 per al següent minijoc", width / 2, height / 2 + 50);

            } else if (gameState === "LOSE_SCREEN_CATCH") {
                background('#FFDF99');
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(48);
                textStyle(BOLD);
                text("HAS PERDUT!", width / 2, height / 2 - 50);
                textSize(24);
                textStyle(BOLD);
                if (endlessModeActive) {
                    text("Plàtans atrapats: " + catchScore, width / 2, height / 2 + 20);
                    text("Prem el Botó 3 per obrir la scoreboard", width / 2, height / 2 + 60);
                } else {
                    text("Atrapats: " + catchScore + "/" + catchTargetScore, width / 2, height / 2 + 20);
                    text("Prem el Botó 4 per tornar a intentar-ho", width / 2, height / 2 + 60);
                }

            } else if (gameState === "SCOREBOARD_CATCH") {
                background('#FFDF99');
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, CENTER);

                // Scoreboard panel is rendered as DOM content; no duplicate canvas text here.
                // ============================
                // MINIGAME 2: PALM TREES
                // ============================
            } else if (gameState === "MINIGAME_PALMTREES") {
                background('#FFDF99');

                imageMode(CENTER);
                let palmScale = 0.22;

                for (let i = 0; i < 4; i++) {
                    let px = width * palmPositionsGame[i].x;
                    let py = height * palmPositionsGame[i].y;

                    // Determine frame: shaking alternates 0/1, idle is 0
                    let frameIdx = 0;
                    if (palmShaking[i]) {
                        let elapsed = millis() - palmShakeTimer[i];
                        if (elapsed < palmShakeDuration) {
                            frameIdx = floor((millis() / 60) % 2); // rapid alternation
                        } else {
                            palmShaking[i] = false;
                        }
                    }

                    // Draw palm tree
                    let spr = palmSprites[i][frameIdx];
                    if (spr) {
                        image(spr, px, py, spr.width * palmScale, spr.height * palmScale);
                    }

                    // Draw hit counter below palm
                    if (!palmDisabled[i]) {
                        fill('rgba(120, 63, 4, 0.7)');
                        noStroke();
                        textAlign(CENTER, TOP);
                        textSize(20);
                        text(palmHits[i] + " / 5", px, py + 120);
                    } else {
                        fill('rgba(120, 63, 4, 0.4)');
                        noStroke();
                        textAlign(CENTER, TOP);
                        textSize(20);
                        text("✓", px, py + 120);
                    }
                }

                // Update and draw falling bananas
                for (let i = palmFallingBananas.length - 1; i >= 0; i--) {
                    let fb = palmFallingBananas[i];
                    fb.y += fb.speed;
                    fb.speed += 0.3; // gravity
                    fb.animFrame = floor((millis() / 150) % 4);

                    let bSpr = palmBananaSprites[fb.animFrame];
                    if (bSpr) {
                        imageMode(CENTER);
                        let bScale = 0.06;
                        image(bSpr, fb.x, fb.y, bSpr.width * bScale, bSpr.height * bScale);
                    }

                    // Remove when off screen
                    if (fb.y > height + 100) {
                        palmFallingBananas.splice(i, 1);
                    }
                }

                // Title
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, TOP);
                textSize(28);
                textStyle(BOLD);
                text("Pica les palmeres! (5 cops cadascuna)", width / 2, 30);

                // Banana counter
                textAlign(CENTER, BOTTOM);
                textSize(24);
                textStyle(BOLD);
                text("Plàtans: " + palmBananasCollected + " / 4", width / 2, height - 30);

                // Button labels below each palm
                textSize(16);
                fill('rgba(120, 63, 4, 0.5)');
                textAlign(CENTER, TOP);
                for (let i = 0; i < 4; i++) {
                    let px = width * palmPositionsGame[i].x;
                    let py = height * palmPositionsGame[i].y;
                    text("Botó " + (i + 1), px, py + 145);
                }

                // Check win condition
                if (palmBananasCollected >= 4 && palmWinTime === 0) {
                    palmWinTime = millis();
                }
                if (palmWinTime > 0 && millis() - palmWinTime >= 4000) {
                    gameState = "WIN_SCREEN_PALMTREES";
                }

            } else if (gameState === "WIN_SCREEN_PALMTREES") {
                background('#FFDF99');
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(48);
                textStyle(BOLD);
                text("PLÀTANS RECOLLITS!", width / 2, height / 2 - 50);
                textSize(24);
                textStyle(BOLD);
                text("Prem el Botó 4 per al següent minijoc", width / 2, height / 2 + 50);

                // ============================
                // MINIGAME 4: PEELING
                // ============================
            } else if (gameState === "MINIGAME_PEELING") {
                background('#FFDF99'); // --color-groc-bananap
                if (startTime === 0) startTime = millis();

                let timeElapsed = millis() - startTime;
                let timeLeft = max(0, maxTime - timeElapsed);

                if (timeLeft === 0) {
                    gameState = "LOSE_SCREEN_PEELING";
                    endTime = millis();
                }

                imageMode(CENTER);
                let currentSprite = peelSprites[peelPhase][currentFrame];
                if (currentSprite) {
                    image(currentSprite, width / 2, height / 2 - 50, currentSprite.width * 0.2, currentSprite.height * 0.2);
                }

                // Draw countdown sprite at bottom center
                let countdownStage = floor(timeElapsed / 2000); // every 2 seconds
                if (countdownStage > 5) countdownStage = 5;
                let countdownFrame = floor((millis() / 300) % 2); // alternate frames
                let cdSprite = countdownSprites[countdownStage][countdownFrame];
                if (cdSprite) {
                    imageMode(CENTER);
                    image(cdSprite, width / 2, height - 130, cdSprite.width * 0.25, cdSprite.height * 0.25);
                }

            } else if (gameState === "WIN_SCREEN_PEELING") {
                background('#FFDF99');
                textAlign(CENTER, CENTER);
                textSize(64);
                textStyle(BOLD);
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                text("PLÀTANS PELATS!", width / 2, height / 2 - 50);
                textSize(32);
                textStyle(BOLD);
                text("Temps: " + ((endTime - startTime) / 1000).toFixed(2) + "s", width / 2, height / 2 + 50);
                text("Prem el Botó 4 per al següent minijoc", width / 2, height / 2 + 100);
            } else if (gameState === "LOSE_SCREEN_PEELING") {
                background('#FFDF99');
                let expFrame = floor((millis() / 200) % 4);
                if (expSprites[expFrame]) {
                    imageMode(CENTER);
                    image(expSprites[expFrame], width / 2, height - 130, expSprites[expFrame].width * 0.25, expSprites[expFrame].height * 0.25);
                }

                textAlign(CENTER, CENTER);
                textSize(64);
                textStyle(BOLD);
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                text("HAS PERDUT!", width / 2, height / 2 - 50);
                textSize(32);
                textStyle(BOLD);
                text("S'ha acabat el temps! Plàtans pelats: " + peeledBananas, width / 2, height / 2 + 50);
                text("Prem el Botó 4 per tornar a intentar-ho", width / 2, height / 2 + 100);

                // ============================
                // MINIGAME 5: SEQUENCE
                // ============================
            } else if (gameState === "MINIGAME_SEQUENCE") {
                background('#FFDF99');

                imageMode(CENTER);
                let scaleBanana = 0.2;
                if (mg5AnimationPlaying) {
                    let elapsed = millis() - mg5LastFrameTime;
                    if (elapsed > 80) { // approx 12.5 fps
                        mg5CurrentAnimFrame++;
                        mg5LastFrameTime = millis();
                    }

                    if (mg5CurrentAnimFrame === 13 && !mg5ShotFired) {
                        if (tiroSound && tiroSound.loaded) {
                            tiroSound.start();
                        }
                        mg5ShotFired = true;
                    }

                    if (mg5CurrentAnimFrame >= 15) {
                        mg5AnimationPlaying = false;
                        mg5CurrentAnimFrame = 0;
                        mg5ActiveButton++;
                        if (mg5ActiveButton > 3) {
                            setTimeout(() => {
                                if (gameState === "MINIGAME_SEQUENCE" && mg5ActiveButton > 3) {
                                    gameState = "WIN_SCREEN";
                                }
                            }, 3000);
                        }
                    }
                }

                if (mg5AnimationPlaying) {
                    let spr = mg5Sprites[mg5ActiveButton][mg5CurrentAnimFrame];
                    if (spr) {
                        image(spr, width / 2, height / 2 - 50, spr.width * scaleBanana, spr.height * scaleBanana);
                    }
                } else {
                    if (mg5ActiveButton < 4) {
                        let spr = mg5Sprites[mg5ActiveButton][0];
                        if (spr) {
                            image(spr, width / 2, height / 2 - 50, spr.width * scaleBanana, spr.height * scaleBanana);
                        }
                    } else {
                        let spr = mg5Sprites[3][14];
                        if (spr) {
                            image(spr, width / 2, height / 2 - 50, spr.width * scaleBanana, spr.height * scaleBanana);
                        }
                    }
                }


            } else if (gameState === "WIN_SCREEN") {
                background('#FFDF99');
                textAlign(CENTER, CENTER);
                textSize(64);
                textStyle(BOLD);
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                text("VICTÒRIA FINAL!", width / 2, height / 2 - 50);
                textSize(32);
                textStyle(BOLD);
                text("Gràcies per jugar a BANANAP!", width / 2, height / 2 + 50);
                text("Prem el Botó 4 per anar a la selecció", width / 2, height / 2 + 100);
            }

            // Dibuixar el comptador només al segon minijoc (no a la lose screen)
            if (gameState === "MINIGAME_PEELING" || gameState === "WIN_SCREEN_PEELING") {
                let counterFrame = currentFrame;
                if (peeledBananas >= 4) {
                    counterFrame = floor((millis() / 150) % 4);
                }

                let currentCounter = counterSprites[min(peeledBananas, 4)][counterFrame];
                if (currentCounter) {
                    imageMode(CENTER);
                    let w = currentCounter.width * 0.08;
                    let h = currentCounter.height * 0.08;
                    image(currentCounter, 20 + w / 2, height / 2 - 50, w, h);
                }
            }

            syncBackgroundMusic();

            renderUiLayer();


            // Gestionar footer
            if (windowHeight - mouseY < 120) footer.classList.remove('footer--hidden');
            else footer.classList.add('footer--hidden');
        }

        function dispararEfecte(botoId) {
            try {
                // --- MINIGAME 1: PLANTS ---
                if (gameState === "INTRO_PLANTS") {
                    if (botoId === 3) {
                        gameState = "MINIGAME_PLANTS";
                        startTimePlants = 0;
                        plantsWinReady = false;
                    }
                } else if (gameState === "MINIGAME_PLANTS") {
                    if (botoId === 0 && plantsWinReady) {
                        gameState = "WIN_SCREEN_PLANTS";
                        sound3.triggerAttackRelease('A5', '16n');
                    }
                } else if (gameState === "LOSE_SCREEN_PLANTS") {
                    if (botoId === 3) {
                        if (minigameHubMode) {
                            enterSelectionHub();
                        } else {
                            gameState = "MINIGAME_PLANTS";
                            startTimePlants = 0;
                            plantsWinReady = false;
                        }
                    }
                } else if (gameState === "WIN_SCREEN_PLANTS") {
                    if (botoId === 3) {
                        if (minigameHubMode) {
                            enterSelectionHub();
                        } else {
                            gameState = "INTRO_PALMTREES";
                        }
                    }
                } else if (gameState === "INTRO_PALMTREES") {
                    if (botoId === 3) {
                        gameState = "MINIGAME_PALMTREES";
                        palmHits = [0, 0, 0, 0];
                        palmDropped = [false, false, false, false];
                        palmDisabled = [false, false, false, false];
                        palmShaking = [false, false, false, false];
                        palmShakeTimer = [0, 0, 0, 0];
                        palmFallingBananas = [];
                        palmBananasCollected = 0;
                        palmWinTime = 0;
                    }
                } else if (gameState === "WIN_SCREEN_CATCH") {
                    if (botoId === 3) {
                        if (minigameHubMode) {
                            enterSelectionHub();
                        } else {
                            gameState = "INTRO_PEELING";
                        }
                    }
                } else if (gameState === "INTRO_PEELING") {
                    if (botoId === 3) {
                        gameState = "MINIGAME_PEELING";
                        peeledBananas = 0;
                        peelPhase = 0;
                        currentSequenceIndex = 0;
                        startTime = 0;
                    }
                } else if (gameState === "LOSE_SCREEN_CATCH") {
                    if (endlessModeActive && botoId === 2) {
                        gameState = "SCOREBOARD_CATCH";
                    } else if (botoId === 3) {
                        if (minigameHubMode) {
                            enterSelectionHub();
                            endlessModeActive = false;
                        } else {
                            gameState = "MINIGAME_CATCH";
                            catchScore = 0;
                            catchLives = 3;
                            fallingBananas = [];
                            startTimeCatch = 0;
                            lastBananaSpawn = 0;
                            catchTotalSpawned = 0;
                            // Keep endlessModeActive flag for continuous retry
                        }
                    }
                } else if (gameState === "SCOREBOARD_CATCH") {
                    if (botoId === 3) {
                        enterSelectionHub();
                        endlessModeActive = false;
                    }
                    // --- MINIGAME 2: PALM TREES ---
                } else if (gameState === "MINIGAME_PALMTREES") {
                    if (!palmDisabled[botoId]) {
                        if (palmSound) {
                            palmSound.start();
                        }
                        palmHits[botoId]++;
                        palmShaking[botoId] = true;
                        palmShakeTimer[botoId] = millis();

                        if (palmHits[botoId] >= 5 && !palmDropped[botoId]) {
                            palmDropped[botoId] = true;
                            palmDisabled[botoId] = true;
                            palmBananasCollected++;
                            sound3.triggerAttackRelease('A5', '16n');

                            // Spawn falling banana at palm position
                            let px = width * palmPositionsGame[botoId].x;
                            let py = height * palmPositionsGame[botoId].y - 50;
                            palmFallingBananas.push({
                                x: px,
                                y: py,
                                speed: 1,
                                animFrame: 0
                            });
                        }
                    }
                } else if (gameState === "WIN_SCREEN_PALMTREES") {
                    if (botoId === 3) {
                        if (minigameHubMode) {
                            enterSelectionHub();
                        } else {
                            gameState = "INTRO_CATCH";
                        }
                    }
                } else if (gameState === "INTRO_CATCH") {
                    if (botoId === 3) {
                        gameState = "MINIGAME_CATCH";
                        catchScore = 0;
                        catchLives = 3;
                        fallingBananas = [];
                        startTimeCatch = 0;
                        lastBananaSpawn = 0;
                        catchTotalSpawned = 0;
                    }
                    // --- MINIGAME 3: PEELING ---
                } else if (gameState === "MINIGAME_PEELING") {
                    if (botoId === targetSequence[currentSequenceIndex]) {
                        if (cintaSound) {
                            cintaSound.start();
                        }
                        currentSequenceIndex++;
                        peelPhase = currentSequenceIndex;
                        isBouncing = true;
                        bounceTimer = millis();

                        if (currentSequenceIndex >= targetSequence.length) {
                            currentSequenceIndex = 0;
                            peeledBananas++;
                            sound3.triggerAttackRelease('A5', '16n');

                            if (peeledBananas >= 4) {
                                gameState = "WIN_SCREEN_PEELING";
                                endTime = millis();
                                sound0.triggerAttackRelease('C1', '8n');
                            } else {
                                setTimeout(() => {
                                    if (gameState === "MINIGAME_PEELING") peelPhase = 0;
                                }, 300);
                            }
                        }
                    } else {
                        currentSequenceIndex = 0;
                        peelPhase = 0;
                        sound1.triggerAttackRelease('16n');
                    }
                } else if (gameState === "WIN_SCREEN_PEELING") {
                    if (botoId === 3) {
                        if (minigameHubMode) {
                            enterSelectionHub();
                        } else {
                            gameState = "INTRO_SEQUENCE";
                        }
                    }
                } else if (gameState === "INTRO_SEQUENCE") {
                    if (botoId === 3) {
                        gameState = "MINIGAME_SEQUENCE";
                        mg5ActiveButton = 0;
                        mg5AnimationPlaying = false;
                        mg5CurrentAnimFrame = 0;
                        mg5ShotFired = false;
                    }
                } else if (gameState === "LOSE_SCREEN_PEELING") {
                    if (botoId === 3) {
                        if (minigameHubMode) {
                            enterSelectionHub();
                        } else {
                            gameState = "INTRO_PEELING";
                        }
                    }
                } else if (gameState === "MINIGAME_SEQUENCE") {
                    if (!mg5AnimationPlaying && botoId === mg5ActiveButton) {
                        if (comerSound) {
                            comerSound.start();
                        }
                        mg5AnimationPlaying = true;
                        mg5CurrentAnimFrame = 0;
                        mg5LastFrameTime = millis();
                        mg5ShotFired = false;
                    } else if (!mg5AnimationPlaying) {
                        // Feedback d'error eliminat segons petició
                    }
                } else if (gameState === "WIN_SCREEN") {
                    if (botoId === 3) {
                        enterSelectionHub();
                    }
                }
            } catch (e) {
                console.warn(e);
            }
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>

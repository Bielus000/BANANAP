<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANANAP</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.37/Tone.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #FFEDC5;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .connect-btn {
            margin-top: 30px;
            font-size: 24px;
            padding: 15px 40px;
            background: transparent;
            border: 3px solid rgba(120, 63, 4, 0.8);
            cursor: pointer;
            color: rgba(120, 63, 4, 1);
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
            z-index: 20;
        }

        .connect-btn:hover {
            background: rgba(120, 63, 4, 0.1);
            transform: scale(1.05);
        }

        #connection-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 15;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            color: rgba(120, 63, 4, 0.5);
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="start-screen" class="start-screen">
        <img src="media/Logo.png" alt="Logo BANANAP" class="start-logo">
        <p class="text-style-title-text">Connect Arduino & Pump Up the speakers</p>
        <button id="connect-btn" class="connect-btn text-style-footer-button">Connect Arduino</button>
    </div>

    <div id="connection-status">Not connected</div>

    <footer class="footer">
        <div class="footer-content">
            <nav class="footer-nav" aria-label="Enllaços de peu de pàgina">
                <a class="footer-button text-style-footer-button" href="about.html">About</a>
                <a class="footer-button text-style-footer-button" href="contact.html">Contact</a>
                <a class="footer-button text-style-footer-button" href="suport.html">Suport</a>
            </nav>
            <p class="text-style-small-text">Created with love ©Bananap 2026. All rights reserved</p>
        </div>
    </footer>

    <script>
        let elements = [];
        let experienciaIniciada = false;
        let toneStarted = false;

        let bgCol;
        let shapeCol;

        // --- GAME STATE ---
        let gameState = "START";

        // --- MINIGAME 1: PLANTS ---
        let imgMono;
        let imgPlants = [];
        let plantPositions = [
            { x: 0.15, y: 0.2 },   // superior esquerra
            { x: 0.85, y: 0.2 },   // superior dreta
            { x: 0.15, y: 0.8 },   // inferior esquerra
            { x: 0.90, y: 0.8 }    // inferior dreta
        ];
        let plantsWinReady = false;
        let startTimePlants = 0;
        let maxTimePlants = 12000; // 12 seconds

        // --- MINIGAME 2: PEELING ---
        let peeledBananas = 0;
        let peelPhase = 0;
        const targetSequence = [0, 1, 2];
        let currentSequenceIndex = 0;
        let startTime = 0;
        let endTime = 0;
        let isBouncing = false;
        let bounceTimer = 0;
        let peelSprites = [];
        let counterSprites = [];
        let countdownSprites = []; // 10s, 8s, 6s, 4s, 2s, 0s
        let expSprites = []; // explosion animation
        let explanationSprites = []; // explanation animation
        let maxTime = 12000; // 6 stages x 2 seconds = 12 seconds

        // --- ARDUINO DATA ---
        let faders = [512, 0, 512, 0, 0]; // F1:Filter, F2:Palette, F3:Scale, F4:Reverb, F5:Thickness
        let buttons = [0, 0, 0, 0];
        let prevButtons = [0, 0, 0, 0];
        let port;
        let reader;
        let inputBuffer = '';

        // --- PALETA BANANAP ---
        const palettes = [
            { bg: [41, 23, 100], fg: [30, 97, 47] },
            { bg: [41, 23, 100], fg: [321, 80, 71] },
            { bg: [41, 23, 100], fg: [237, 70, 81] },
            { bg: [41, 40, 100], fg: [6, 81, 100] },
            { bg: [41, 40, 100], fg: [31, 80, 21] },
            { bg: [186, 50, 96], fg: [30, 97, 47] },
            { bg: [186, 50, 96], fg: [6, 81, 100] },
            { bg: [72, 68, 98], fg: [321, 80, 71] },
            { bg: [72, 68, 98], fg: [237, 70, 81] },
            { bg: [30, 97, 47], fg: [41, 100, 99] },
            { bg: [31, 80, 21], fg: [186, 50, 96] },
            { bg: [237, 70, 81], fg: [72, 68, 98] },
            { bg: [321, 80, 71], fg: [41, 100, 99] },
            { bg: [68, 18, 67], fg: [25, 91, 100] },
            { bg: [6, 81, 100], fg: [41, 23, 100] }
        ];
        let currentPalette = 0;

        // --- GLOBAL AUDIO EFFECTS ---
        let masterFilter;
        let masterReverb;
        let sound0, sound1, sound2, sound3;

        function setupAudio() {
            // Setup global effects
            masterFilter = new Tone.Filter({ type: "lowpass", frequency: 20000 }).toDestination();
            masterReverb = new Tone.Reverb({ decay: 2.0, preDelay: 0.01 }).connect(masterFilter);

            // Generate Reverb IR
            masterReverb.generate();

            // Setup 4 distinct sounds for the 4 buttons routing to Reverb
            // Sound 0: Deep Kick
            sound0 = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, envelope: { attack: 0.001, decay: 0.25, sustain: 0, release: 0.1 } }).connect(masterReverb);
            // Sound 1: Snare/Hat
            sound1 = new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.001, decay: 0.12, sustain: 0, release: 0.05 } }).connect(masterReverb);
            // Sound 2: Pluck
            sound2 = new Tone.PluckSynth({ attackNoise: 2, dampening: 3500, resonance: 0.95 }).connect(masterReverb);
            // Sound 3: FM Bell
            sound3 = new Tone.FMSynth({ harmonicity: 3, modulationIndex: 8, envelope: { attack: 0.001, decay: 0.3, sustain: 0, release: 0.1 }, modulation: { type: 'square' } }).connect(masterReverb);
        }

        // --- DOM ---
        const startScreen = document.getElementById('start-screen');
        const connectBtn = document.getElementById('connect-btn');
        const footer = document.querySelector('.footer');
        const statusText = document.getElementById('connection-status');

        // --- SERIAL CONNECTION ---
        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 }); // Canviat a 115200

                if (!toneStarted) {
                    await Tone.start();
                    setupAudio();
                    toneStarted = true;
                }

                startScreen.style.display = 'none';
                if (footer) footer.classList.add('footer--hidden');
                experienciaIniciada = true;
                gameState = "MINIGAME_PLANTS";
                statusText.innerText = "Arduino Connected";
                loop();

                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                readLoop();
            } catch (err) {
                console.error("Connection error:", err);
                alert("Error: " + err.message);
            }
        }

        connectBtn.addEventListener('click', connectSerial);

        async function readLoop() {
            while (true) {
                const { value, done } = await reader.read();
                if (done) {
                    reader.releaseLock();
                    break;
                }
                if (value) {
                    // Depuració: Mostrar immediatament si arriba ALGUN tipus de dada
                    if (!statusText.innerText.startsWith("Rebent:")) {
                        statusText.innerText = "Dades crues rebent-se... (esperant salt de línia)";
                    }

                    inputBuffer += value;
                    let lines = inputBuffer.split('\n');
                    // Process all complete lines
                    for (let i = 0; i < lines.length - 1; i++) {
                        processArduinoData(lines[i].trim());
                    }
                    // Keep incomplete part in buffer
                    inputBuffer = lines[lines.length - 1];
                }
            }
        }

        function processArduinoData(line) {
            if (!line) return;

            // Per depurar: mostrar la línia rebuda al panell i a la consola
            statusText.innerText = "Rebent: " + line;

            try {
                // L'Arduino està enviant un objecte JSON com: {"f":[0,0,0,0,0],"b":[0,0,1,0]}
                const data = JSON.parse(line);

                if (data.f && data.f.length >= 5) {
                    for (let i = 0; i < 5; i++) {
                        faders[i] = parseInt(data.f[i]);
                    }
                }

                if (data.b && data.b.length >= 4) {
                    for (let i = 0; i < 4; i++) {
                        let currentBtn = parseInt(data.b[i]);
                        if (currentBtn === 1 && prevButtons[i] === 0) {
                            dispararEfecte(i);
                        }
                        prevButtons[i] = currentBtn;
                        buttons[i] = currentBtn;
                    }
                }
            } catch (e) {
                // Si la línia no és JSON vàlid (per exemple si es talla a mig enviar), l'ignorem
                // console.log("Format no vàlid:", line);
            }
        }

        // --- P5 ---
        function preload() {
            // Minigame 1: Plants
            imgMono = loadImage('media/Minigame1/mono.png');
            imgPlants = [
                loadImage('media/Minigame1/1.png'),
                loadImage('media/Minigame1/2.png'),
                loadImage('media/Minigame1/3.png'),
                loadImage('media/Minigame1/4.png')
            ];

            // Minigame 2: Peeling
            peelSprites = [
                [loadImage('media/game3/1.1.png'), loadImage('media/game3/1.1.png')],
                [loadImage('media/game3/2.1.png'), loadImage('media/game3/2.2.png')],
                [loadImage('media/game3/3.1.png'), loadImage('media/game3/3.2.png')],
                [loadImage('media/game3/4.1.png'), loadImage('media/game3/4.2.png')]
            ];
            counterSprites = [
                [loadImage('media/BananaCounter/1.0.png'), loadImage('media/BananaCounter/1.0.png')],
                [loadImage('media/BananaCounter/1.1.png'), loadImage('media/BananaCounter/1.2.png')],
                [loadImage('media/BananaCounter/2.1.png'), loadImage('media/BananaCounter/2.2.png')],
                [loadImage('media/BananaCounter/3.1.png'), loadImage('media/BananaCounter/3.2.png')],
                [
                    loadImage('media/BananaCounter/4.1.png'),
                    loadImage('media/BananaCounter/4.2.png'),
                    loadImage('media/BananaCounter/4.3.png'),
                    loadImage('media/BananaCounter/4.4.png'),
                    loadImage('media/BananaCounter/4.5.png'),
                    loadImage('media/BananaCounter/4.6.png')
                ]
            ];

            // Countdown sprites: 10s, 8s, 6s, 4s, 2s, 0s
            countdownSprites = [
                [loadImage('media/countdown/10s.1.png'), loadImage('media/countdown/10s.2.png')],
                [loadImage('media/countdown/8s.1.png'), loadImage('media/countdown/8s.2.png')],
                [loadImage('media/countdown/6s.1.png'), loadImage('media/countdown/6s.2.png')],
                [loadImage('media/countdown/4s.1.png'), loadImage('media/countdown/4s.2.png')],
                [loadImage('media/countdown/2s.1.png'), loadImage('media/countdown/2s.2.png')],
                [loadImage('media/countdown/0s.1.png'), loadImage('media/countdown/0s.2.png')]
            ];
            expSprites = [
                loadImage('media/countdown/exp.1.png'),
                loadImage('media/countdown/exp.2.png'),
                loadImage('media/countdown/exp.3.png'),
                loadImage('media/countdown/exp.4.png')
            ];
            explanationSprites = [
                loadImage('media/Explanation/1.png'),
                loadImage('media/Explanation/2.png'),
                loadImage('media/Explanation/3.png'),
                loadImage('media/Explanation/4.png'),
                loadImage('media/Explanation/5.png'),
                loadImage('media/Explanation/6.png')
            ];
        }

        function setup() {
            createCanvas(windowWidth, windowHeight);
            colorMode(HSB, 360, 100, 100, 1);
            bgCol = [...palettes[0].bg];
            shapeCol = [...palettes[0].fg];
            textFont('Outfit');
            noLoop();
        }

        function draw() {
            if (!experienciaIniciada) return;

            background(41, 23, 100); // BANANAP groc

            let currentFrame = 0;
            if (isBouncing) {
                currentFrame = 1;
                if (millis() - bounceTimer > 150) {
                    isBouncing = false;
                }
            }

            // ============================
            // MINIGAME 1: PLANTS
            // ============================
            if (gameState === "MINIGAME_PLANTS") {
                if (startTimePlants === 0) startTimePlants = millis();

                let timeElapsed = millis() - startTimePlants;
                let timeLeft = max(0, maxTimePlants - timeElapsed);

                if (timeLeft === 0) {
                    gameState = "LOSE_SCREEN_PLANTS";
                }

                imageMode(CENTER);
                if (imgMono) {
                    image(imgMono, width / 2, height / 2, imgMono.width * 0.15, imgMono.height * 0.15);
                }

                for (let i = 0; i < 4; i++) {
                    let angle = map(faders[i], 0, 1023, PI, PI + HALF_PI);
                    let px = width * plantPositions[i].x;
                    let py = height * plantPositions[i].y;
                    push();
                    translate(px, py);
                    rotate(angle);
                    imageMode(CENTER);
                    if (imgPlants[i]) {
                        image(imgPlants[i], 0, 0, imgPlants[i].width * 0.2, imgPlants[i].height * 0.2);
                    }
                    pop();
                }

                let threshold = 1023 * 0.9;
                plantsWinReady = (faders[0] > threshold && faders[1] > threshold && faders[2] > threshold && faders[3] > threshold);

                // Countdown sprite at bottom center
                let countdownStage = floor(timeElapsed / 2000);
                if (countdownStage > 5) countdownStage = 5;
                let countdownFrame = floor((millis() / 300) % 2);
                let cdSprite = countdownSprites[countdownStage][countdownFrame];
                if (cdSprite) {
                    imageMode(CENTER);
                    image(cdSprite, width / 2, height - 80, cdSprite.width * 0.25, cdSprite.height * 0.25);
                }

                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, TOP);
                textSize(28);
                text("Mou els faders per descobrir el mono!", width / 2, 30);

                if (plantsWinReady) {
                    textAlign(CENTER, BOTTOM);
                    textSize(24);
                    text("Prem el Botó 1 per continuar!", width / 2, height - 30);
                }

            } else if (gameState === "LOSE_SCREEN_PLANTS") {
                // Explosion animation at bottom
                let expFrame = floor((millis() / 200) % 4);
                if (expSprites[expFrame]) {
                    imageMode(CENTER);
                    image(expSprites[expFrame], width / 2, height - 80, expSprites[expFrame].width * 0.25, expSprites[expFrame].height * 0.25);
                }

                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(48);
                text("TEMPS ESGOTAT!", width / 2, height / 2 - 50);
                textSize(24);
                text("Prem el Botó 4 per tornar a intentar-ho", width / 2, height / 2 + 50);

            } else if (gameState === "WIN_SCREEN_PLANTS") {
                imageMode(CENTER);
                if (imgMono) {
                    image(imgMono, width / 2, height / 2, imgMono.width * 0.15, imgMono.height * 0.15);
                }
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                textAlign(CENTER, CENTER);
                textSize(48);
                text("MONO DESCOBERT!", width / 2, height / 2 - 50);
                textSize(24);
                text("Prem el Botó 4 per al següent minijoc", width / 2, height / 2 + 50);

                // ============================
                // MINIGAME 2: PEELING
                // ============================
            } else if (gameState === "MINIGAME_PEELING") {
                background('#FFDF99'); // --color-groc-bananap
                if (startTime === 0) startTime = millis();

                let timeElapsed = millis() - startTime;
                let timeLeft = max(0, maxTime - timeElapsed);

                if (timeLeft === 0) {
                    gameState = "LOSE_SCREEN";
                    endTime = millis();
                }

                imageMode(CENTER);
                let currentSprite = peelSprites[peelPhase][currentFrame];
                if (currentSprite) {
                    image(currentSprite, width / 2, height / 2, currentSprite.width * 0.2, currentSprite.height * 0.2);
                }

                // Draw countdown sprite at bottom center
                let countdownStage = floor(timeElapsed / 2000); // every 2 seconds
                if (countdownStage > 5) countdownStage = 5;
                let countdownFrame = floor((millis() / 300) % 2); // alternate frames
                let cdSprite = countdownSprites[countdownStage][countdownFrame];
                if (cdSprite) {
                    imageMode(CENTER);
                    image(cdSprite, width / 2, height - 80, cdSprite.width * 0.25, cdSprite.height * 0.25);
                }

                // Draw explanation animation on the right
                let expIdx = floor((millis() / 400) % 6);
                if (explanationSprites[expIdx]) {
                    imageMode(CENTER);
                    image(explanationSprites[expIdx], width - 200, height / 2, explanationSprites[expIdx].width * 0.1, explanationSprites[expIdx].height * 0.1);
                }

            } else if (gameState === "WIN_SCREEN") {
                background('#FFDF99'); // --color-groc-bananap
                textAlign(CENTER, CENTER);
                textSize(64);
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                text("YOU WIN!", width / 2, height / 2 - 50);
                textSize(32);
                text("Time: " + ((endTime - startTime) / 1000).toFixed(2) + "s", width / 2, height / 2 + 50);
                text("Press Button 4 to restart", width / 2, height / 2 + 100);
            } else if (gameState === "LOSE_SCREEN") {
                background('#FFDF99'); // --color-groc-bananap
                // Draw explosion animation at bottom center
                let expFrame = floor((millis() / 200) % 4);
                if (expSprites[expFrame]) {
                    imageMode(CENTER);
                    image(expSprites[expFrame], width / 2, height - 80, expSprites[expFrame].width * 0.25, expSprites[expFrame].height * 0.25);
                }

                textAlign(CENTER, CENTER);
                textSize(64);
                fill('rgba(120, 63, 4, 1)');
                noStroke();
                text("YOU LOSE!", width / 2, height / 2 - 50);
                textSize(32);
                text("Time's up! Bananas peeled: " + peeledBananas, width / 2, height / 2 + 50);
                text("Press Button 4 to restart", width / 2, height / 2 + 100);
            }

            // Dibuixar el comptador només al segon minijoc (no a la lose screen)
            if (gameState === "MINIGAME_PEELING" || gameState === "WIN_SCREEN") {
                let counterFrame = currentFrame;
                if (peeledBananas >= 4) {
                    counterFrame = floor((millis() / 150) % 4);
                }

                let currentCounter = counterSprites[min(peeledBananas, 4)][counterFrame];
                if (currentCounter) {
                    imageMode(CENTER);
                    let w = currentCounter.width * 0.08;
                    let h = currentCounter.height * 0.08;
                    image(currentCounter, 20 + w / 2, height / 2, w, h);
                }
            }


            // Gestionar footer
            if (windowHeight - mouseY < 120) footer.classList.remove('footer--hidden');
            else footer.classList.add('footer--hidden');
        }

        function dispararEfecte(botoId) {
            try {
                // --- MINIGAME 1: PLANTS ---
                if (gameState === "MINIGAME_PLANTS") {
                    if (botoId === 0 && plantsWinReady) {
                        gameState = "WIN_SCREEN_PLANTS";
                        sound3.triggerAttackRelease('A5', '16n');
                    }
                } else if (gameState === "LOSE_SCREEN_PLANTS") {
                    if (botoId === 3) {
                        gameState = "MINIGAME_PLANTS";
                        startTimePlants = 0;
                        plantsWinReady = false;
                        sound2.triggerAttack('C4');
                    }
                } else if (gameState === "WIN_SCREEN_PLANTS") {
                    if (botoId === 3) {
                        gameState = "MINIGAME_PEELING";
                        peeledBananas = 0;
                        peelPhase = 0;
                        currentSequenceIndex = 0;
                        startTime = 0;
                        sound2.triggerAttack('C4');
                    }
                    // --- MINIGAME 2: PEELING ---
                } else if (gameState === "MINIGAME_PEELING") {
                    if (botoId === targetSequence[currentSequenceIndex]) {
                        currentSequenceIndex++;
                        peelPhase = currentSequenceIndex;
                        isBouncing = true;
                        bounceTimer = millis();
                        sound2.triggerAttack('C4');

                        if (currentSequenceIndex >= targetSequence.length) {
                            currentSequenceIndex = 0;
                            peeledBananas++;
                            sound3.triggerAttackRelease('A5', '16n');

                            if (peeledBananas >= 4) {
                                gameState = "WIN_SCREEN";
                                endTime = millis();
                                sound0.triggerAttackRelease('C1', '8n');
                            } else {
                                setTimeout(() => {
                                    if (gameState === "MINIGAME_PEELING") peelPhase = 0;
                                }, 300);
                            }
                        }
                    } else {
                        currentSequenceIndex = 0;
                        peelPhase = 0;
                        sound1.triggerAttackRelease('16n');
                    }
                } else if (gameState === "WIN_SCREEN" || gameState === "LOSE_SCREEN") {
                    if (botoId === 3) {
                        gameState = "MINIGAME_PEELING";
                        peeledBananas = 0;
                        peelPhase = 0;
                        currentSequenceIndex = 0;
                        startTime = millis();
                        sound2.triggerAttack('C4');
                    }
                }
            } catch (e) {
                console.warn(e);
            }
        }

        // ---- VISUAL CLASSES ----

        class Ring {
            constructor(x, y, h, sw, spd) {
                this.x = x; this.y = y; this.h = h; this.sw = sw; this.r = 0; this.a = 1; this.spd = spd;
            }
            update() { this.r += this.spd; this.a -= 0.025; }
            display(thick) {
                noFill(); stroke(this.h, shapeCol[1], shapeCol[2], this.a); strokeWeight(this.sw * thick);
                ellipse(this.x, this.y, this.r * 2);
            }
            isDead() { return this.a <= 0; }
        }

        class Shrink {
            constructor(x, y, h, sz) {
                this.x = x; this.y = y; this.h = h; this.sz = sz; this.a = 0.9;
            }
            update() { this.sz -= 4; this.a -= 0.03; }
            display(thick) {
                if (this.sz > 0) { noStroke(); fill(this.h, shapeCol[1], shapeCol[2], this.a); ellipse(this.x, this.y, this.sz); }
            }
            isDead() { return this.a <= 0 || this.sz <= 0; }
        }

        class Dot {
            constructor(x, y, h, sz, spd) {
                this.h = h; this.sz = sz; this.a = 1;
                const ang = random(TWO_PI);
                this.x = x; this.y = y; this.vx = cos(ang) * spd; this.vy = sin(ang) * spd;
            }
            update() { this.x += this.vx; this.y += this.vy; this.a -= 0.03; this.vx *= 0.96; this.vy *= 0.96; }
            display(thick) {
                noStroke(); fill(this.h, shapeCol[1], shapeCol[2], this.a); ellipse(this.x, this.y, this.sz);
            }
            isDead() { return this.a <= 0; }
        }

        class RadLine {
            constructor(x, y, h, ang, sw) {
                this.x = x; this.y = y; this.h = h; this.ang = ang; this.sw = sw; this.len = 0; this.a = 1;
            }
            update() { this.len += 10; this.a -= 0.03; }
            display(thick) {
                stroke(this.h, shapeCol[1], shapeCol[2], this.a); strokeWeight(this.sw * thick);
                const ex = this.x + cos(this.ang) * this.len, ey = this.y + sin(this.ang) * this.len;
                line(this.x, this.y, ex, ey);
            }
            isDead() { return this.a <= 0; }
        }

        class Diamond {
            constructor(x, y, h, rot) {
                this.x = x; this.y = y; this.h = h; this.rot = rot; this.sz = 0; this.a = 1; this.angle = 0;
            }
            update() { this.sz += 6; this.a -= 0.025; if (this.rot) this.angle += 0.04; }
            display(thick) {
                push(); translate(this.x, this.y); rotate(this.angle);
                noFill(); stroke(this.h, shapeCol[1], shapeCol[2], this.a); strokeWeight(8 * thick);
                const s = this.sz;
                quad(0, -s, s, 0, 0, s, -s, 0); pop();
            }
            isDead() { return this.a <= 0; }
        }

        class ParBars {
            constructor(h, vert, count, spacing) {
                this.h = h; this.vert = vert; this.a = 1; this.bars = [];
                const mid = vert ? width / 2 : height / 2;
                for (let i = 0; i < count; i++) {
                    this.bars.push(mid + (i - floor(count / 2)) * spacing);
                }
            }
            update() { this.a -= 0.03; }
            display(thick) {
                stroke(this.h, shapeCol[1], shapeCol[2], this.a); strokeWeight(10 * thick);
                for (const pos of this.bars) {
                    if (this.vert) line(pos, 0, pos, height);
                    else line(0, pos, width, pos);
                }
            }
            isDead() { return this.a <= 0; }
        }

        class ZigZag {
            constructor(h) {
                this.h = h; this.a = 1; this.progress = 0;
            }
            update() { this.progress += 15; this.a -= 0.025; }
            display(thick) {
                noFill(); stroke(this.h, shapeCol[1], shapeCol[2], this.a); strokeWeight(10 * thick);
                beginShape();
                const amp = 40, freq = 50, cy = height / 2;
                for (let x = 0; x < min(this.progress, width); x += 5) {
                    vertex(x, cy + sin(x / freq * TWO_PI) * amp);
                }
                endShape();
            }
            isDead() { return this.a <= 0; }
        }

        class Flash {
            constructor(h, s, b) { this.h = h; this.s = s; this.b = b; this.a = 0.7; }
            update() { this.a -= 0.07; }
            display(thick) {
                noStroke(); fill(this.h, this.s, this.b, this.a); rect(0, 0, width, height);
            }
            isDead() { return this.a <= 0; }
        }

        function windowResized() { resizeCanvas(windowWidth, windowHeight); }
    </script>
    <script src="js/main.js"></script>
</body>

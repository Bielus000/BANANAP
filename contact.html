<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | BANANAP</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body style="margin:0; background:#FFEDC5; font-family:Outfit, sans-serif; overflow-y: auto;">
    <a class="page-top-home" href="index.html" aria-label="Tornar a la pagina principal">
        <img src="media/Logo.png" alt="BANANAP Home">
    </a>

    <main class="page-section">
        <h1 class="text-style-title-text section-title">Parlem?</h1>
        <p class="text-style-body-text section-desc">
            Vols portar BANANAP al teu festival, exposició o galeria d'art? Tens algun dubte sobre el projecte o
            simplement ens vols saludar? Escriu-nos i et respondrem al més aviat possible.
        </p>

        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="name" class="text-style-body-text form-label">Nom</label>
                <input type="text" id="name" name="name" class="form-input" required placeholder="El teu nom">
            </div>

            <div class="form-group">
                <label for="email" class="text-style-body-text form-label">Correu electrònic</label>
                <input type="email" id="email" name="email" class="form-input" required placeholder="hola@exemple.com">
            </div>

            <div class="form-group">
                <label for="message" class="text-style-body-text form-label">Missatge</label>
                <textarea id="message" name="message" class="form-input form-textarea" rows="5" required
                    placeholder="Escriu aquí el teu missatge..."></textarea>
            </div>

            <button type="submit" class="text-style-footer-button form-submit">Enviar Missatge</button>
        </form>
    </main>

    <footer class="footer static-footer">
        <div class="footer-content">
            <nav class="footer-nav" aria-label="Enllaços de peu de pàgina">
                <a class="text-style-footer-button" href="about.html">About</a>
                <a class="text-style-footer-button" href="contact.html">Contact</a>
                <a class="text-style-footer-button" href="suport.html">Suport</a>
            </nav>
            <p class="text-style-small-text">Created with love ©Bananap 2026. All rights reserved</p>
        </div>
    </footer>
    <script src="js/main.js"></script>
</body>

</html>
